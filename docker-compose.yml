# Convenience wrapper for the local-only development images, equivalent to
# "make build-debian" and friends. The top-level "version" key was removed: it is
# obsolete in Compose v2, which warns about it.
#
# ubuntu is not listed because it is in EXCLUDE.
services:
  debian:
    build:
      context: debian
    image: devel:debian
  centos:
    build:
      context: centos
    image: devel:centos
  fedora:
    build:
      context: fedora
    image: devel:fedora
