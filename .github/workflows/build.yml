name: build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Only one publishing run at a time, so two pushes can't race to write the same
# tag. In-progress PR builds are cancelled when the PR is updated.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; the jobs that need more ask for it.
permissions:
  contents: read

jobs:
  # Lint and consistency checks that do not depend on which images changed, so
  # they run on every push and pull request. "make check" is the same entry point
  # a developer uses locally, which keeps the hadolint version and threshold in
  # one place instead of duplicated here.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: make check
        run: make check

  # Decide what needs building. An image is built only when the tag in its TAG
  # file is not already present in the registry, so bumping TAG is what triggers
  # a release. Pull requests additionally build whatever they touched, so a change
  # is validated even without a TAG bump.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Detecting what a pull request changed needs its merge base, which the
          # default shallow clone does not have. Quoted so the expression yields
          # the string "0" rather than the falsy number 0.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Resolve images to build
        id: matrix
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          force=''
          if [ "$EVENT_NAME" = pull_request ]; then
            force=$(./changed_images.sh "$BASE_SHA")
          fi

          # build_matrix.sh explains each decision on stderr; keep it for the run
          # summary instead of throwing it away.
          images=$(FORCE_IMAGES="$force" ./build_matrix.sh 2>matrix.log) || {
            cat matrix.log >&2
            exit 1
          }
          cat matrix.log >&2

          count=$(printf '%s' "$images" | jq 'length')

          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          {
            echo "### Images to build: $count"
            if [ "$count" -eq 0 ]; then
              echo
              echo "Nothing to do — every TAG is already published."
            else
              printf '%s' "$images" | jq -r '.[] | "- `\(.)`"'
            fi

            echo
            echo "<details><summary>How each image was decided</summary>"
            echo
            echo '```'
            cat matrix.log
            echo '```'
            echo
            echo "</details>"

            if [ -n "$(./excluded.sh)" ]; then
              echo
              echo "### Excluded by EXCLUDE"
              ./excluded.sh | jq -Rr '"- `\(.)`"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [prepare, checks]
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One bad image shouldn't stop the rest from publishing.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}
    env:
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      # Passed through the environment rather than interpolated into the shell,
      # so a directory name can never be read as script.
      IMAGE: ${{ matrix.image }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        env:
          # Pull requests also build the untagged base images when they change,
          # and nothing is pushed, so give those a tag instead of failing. Pushes
          # leave this empty, where a missing TAG stays an error.
          DEFAULT_TAG: ${{ github.event_name == 'pull_request' && 'latest' || '' }}
        run: ./image_meta.sh "$IMAGE" >> "$GITHUB_OUTPUT"

      # Pull requests validate the build without publishing. Emulated ppc64le and
      # arm builds are slow, so PRs check the native platform only; pushes build
      # the full platform list.
      - name: Select platforms
        id: platforms
        env:
          IMAGE_PLATFORMS: ${{ steps.meta.outputs.platforms }}
        run: |
          list="$IMAGE_PLATFORMS"
          if [ "$EVENT_NAME" = pull_request ]; then
            # ...unless the image cannot be built for amd64 at all, in which case
            # its declared list is the only thing worth trying.
            case ",${IMAGE_PLATFORMS}," in
              *,linux/amd64,*) list=linux/amd64 ;;
            esac
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every tag for the image is passed in one invocation, so a multi-arch
      # image is built once and not rebuilt per tag.
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: ${{ steps.platforms.outputs.list }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' }}
          # image.source is what makes GHCR attach the package to this repository,
          # which in turn gives it the repo's visibility and the
          # /pkgs/container/<name> URL. Without it the package is orphaned.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # These images are plain runtime containers; attestation manifests only
          # add clutter to the package listing.
          provenance: false

      - name: Summary
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PLATFORM_LIST: ${{ steps.platforms.outputs.list }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            action=validated
          else
            action=published
          fi
          echo "- \`${TAGS:-$IMAGE}\` (${PLATFORM_LIST:-unknown}) ${action}: ${STATUS}" \
            >> "$GITHUB_STEP_SUMMARY"
