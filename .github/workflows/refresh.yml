name: refresh

on:
  schedule:
    - cron: '50 4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  packages: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Refresh image tags
        id: refresh
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ./update_tags.sh --write
          make readme
          if git diff --quiet -- '*/TAG' README.md; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate updates
        if: steps.refresh.outputs.changed == 'true'
        run: make check

      - name: Commit updates
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git add -- '*/TAG' README.md
          git commit -m 'Refresh container images'
          git pull --rebase --autostash
          git push

      # GITHUB_TOKEN pushes do not emit another push workflow, so explicitly
      # dispatch the existing publisher against the new default-branch head.
      - name: Publish updated images
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref master
